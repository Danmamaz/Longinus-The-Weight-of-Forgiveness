name: Longinus CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    name: Форматування, Стиль та Аналіз
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Переконайся, що версія відповідає твоїй версії Unity

      - name: Code Formatting & Style (Перевірка стилю та форматування)
        # Вимагає наявності файлу .editorconfig у корені репозиторію
        run: dotnet format whitespace --verify-no-changes

      - name: Static Analysis (Статичний аналізатор)
        run: dotnet format analyzers --verify-no-changes

  unity-tests:
    name: Юніт тести Unity
    runs-on: ubuntu-latest
    needs: code-quality # Тести запустяться тільки якщо код чистий
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true # Критично важливо для Unity проєктів

      # Використовуємо індустріальний стандарт для Unity CI - GameCI
      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          # Ці змінні ТРЕБА додати в GitHub Secrets твого репозиторію
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: all # Запускає EditMode та PlayMode тести